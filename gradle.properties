# This doesn't need to be false, and some projects may be able to take advantage of setting daemon to true.
# We set it to false by default in order to avoid too many daemons from being created and persisting; each needs RAM.
org.gradle.daemon=false
# Sets starting memory usage to 512MB, maximum memory usage to 2GB, and tries to set as much to use Unicode as we can.
# (gdx-liftoff uses 1GB; the TeaVM compile is more comfortable with 2GB.)
org.gradle.jvmargs=-Xms512M -Xmx2G -Dfile.encoding=UTF-8 -Dconsole.encoding=UTF-8
# "Configure on-demand" must be false because it breaks projects that have Android modules. The default is also false.
org.gradle.configureondemand=false
# gdx-liftoff defaults this to 'quiet'. We use Gradle's default ('lifecycle') so test results and task names are shown.
# Documented at: https://docs.gradle.org/current/userguide/command_line_interface.html#sec:command_line_logging
org.gradle.logging.level=lifecycle
enableGraalNative=false
gdxVersion=1.14.2
gdxTeaVMVersion=1.6.2
lwjgl3Version=3.4.3
junitVersion=5.14.4
projectVersion=0.1.0
