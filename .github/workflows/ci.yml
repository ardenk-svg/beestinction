# Runs on every pull request to main (CLAUDE.md Part F). Make this job a required status check in the branch
# protection rule for main (see README "Branch protection").
name: CI

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Build (compile + test)
        run: ./gradlew build

      - name: Smoke tests
        run: ./gradlew smokeTest

      - name: Web build (TeaVM)
        run: ./gradlew teavm:build
